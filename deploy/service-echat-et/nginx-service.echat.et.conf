# service.echat.et: five apps on one domain.
#
# Where this goes: Plesk > Domains > service.echat.et > Apache & nginx Settings >
# "Additional nginx directives" (location blocks only; Plesk already provides the server block,
# TLS and server_name). On a plain nginx host, put the upstream blocks in http {} and the
# locations in the HTTPS server block for service.echat.et.
#
# Each upstream is the address the app listens on. Adjust ports/hosts to how the apps run on the
# server. Nothing here contains a secret.

# ---- Upstreams (http context; in Plesk put them in "Additional nginx directives (http)" or
# ---- inline the addresses in proxy_pass below) -------------------------------------------------
upstream clinic     { server 127.0.0.1:3001; keepalive 16; }   # Clinic / NiniMed (Next.js)
upstream school     { server 127.0.0.1:3002; keepalive 16; }   # School / Forma  (Next.js, NEXT_PUBLIC_BASE_PATH=/school)
upstream feud       { server 127.0.0.1:3333; keepalive 16; }   # Feud (custom server.js + socket.io)
upstream paraphrase { server 127.0.0.1:44000; keepalive 16; }  # Paraphrase (uvicorn)
upstream wa         { server 127.0.0.1:3005; keepalive 16; }   # WA / Ethiopian Wisdom (Next.js, NEXT_PUBLIC_BASE_PATH=/wa)

# ---- Locations (server context) -----------------------------------------------------------------
# Passenger would intercept proxied paths on the Plesk domain; keep it off for every block below.

# Portal page at the exact root
location = / {
    passenger_enabled off;
    default_type text/html;
    alias /var/www/vhosts/echat.et/service.echat.et/portal/index.html;   # copy deploy/service-echat-et/portal/index.html here
}

# School: keeps its /school prefix (Next basePath)
location ~ ^/school(/|$) {
    passenger_enabled off;
    proxy_pass http://school;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    client_max_body_size 110m;      # learning resources up to 100 MB
}

# WA: keeps its /wa prefix (Next basePath)
location ~ ^/wa(/|$) {
    passenger_enabled off;
    proxy_pass http://wa;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    client_max_body_size 25m;
}

# Feud: keeps its /feud prefix (Next basePath); /feud/socket.io needs the WebSocket upgrade
location ~ ^/feud(/|$) {
    passenger_enabled off;
    proxy_pass http://feud;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;       # long-lived socket connections
    proxy_buffering off;
}

# Paraphrase: the prefix is STRIPPED (trailing slash in proxy_pass); the app adds it to the URLs it
# hands out from PUBLIC_BASE_URL=https://service.echat.et/paraphrase
location = /paraphrase { return 301 /paraphrase/; }
location ^~ /paraphrase/ {
    passenger_enabled off;
    proxy_pass http://paraphrase/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;        # document jobs
    proxy_buffering off;            # job progress is streamed as server-sent events
    client_max_body_size 50m;       # keep >= MAX_UPLOAD_SIZE_MB
}

# Clinic / NiniMed: /health is served by its own middleware. Clinic is also the default app, so its
# build assets and legacy root-relative URLs (no Next basePath) live at the domain root. The other
# four apps use prefixed assets (/school/_next, /wa/_next, /feud/_next, /paraphrase/static).
location = /health { return 301 /health/; }
location ~ ^/(health/|_next/|api/|icons/|downloads/|sw\.js$|manifest\.webmanifest$|manifest\.json$|favicon\.ico$|icon\.svg$|robots\.txt$|sitemap\.xml$) {
    passenger_enabled off;
    proxy_pass http://clinic;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_buffering off;            # notifications stream (server-sent events)
    client_max_body_size 25m;
}

# Anything else is Clinic's too (its middleware redirects old root URLs to /health/...), as on www.
location / {
    passenger_enabled off;
    proxy_pass http://clinic;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ---- http context, once (needed by the Feud block above) ----------------------------------------
