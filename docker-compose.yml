services:
  # ==========================================
  # 1. Nini CLINICAL APPLICATION (BUN + NEXTJS)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Nini_clinical_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:root@mysql:3306/clinic_enterprise
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1:-}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2:-}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3:-}
      - NEXT_PUBLIC_APP_NAME=NiniMed Enterprise CDSS
      - NEXT_PUBLIC_APP_VERSION=3.0.0-enterprise
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-Ninimedbot}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - Nini_network

  # ==========================================
  # 2. MYSQL 8
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: Nini_mysql_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=clinic_enterprise
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Nini_network

  # ==========================================
  # 3. REDIS (SESSION, CACHING & QUEUE)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: Nini_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Nini_network

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
networks:
  Nini_network:
    driver: bridge

volumes:
  mysqldata:
    driver: local
  redisdata:
    driver: local
