services:
  # ==========================================
  # DEVELOPMENT APP (BUN LIVE WATCH / HOT RELOAD)
  # ==========================================
  app-dev:
    image: oven/bun:1-alpine
    container_name: Nini_clinical_app_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://root:root@mysql:3306/clinic_enterprise
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: sh -c "bun install && bun run dev"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - Nini_network

  mysql:
    image: mysql:8.0
    container_name: Nini_mysql_dev
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=clinic_enterprise
    volumes:
      - mysqldata_dev:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Nini_network

  redis:
    image: redis:7-alpine
    container_name: Nini_redis_dev
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - Nini_network

networks:
  Nini_network:
    driver: bridge

volumes:
  mysqldata_dev:
    driver: local
