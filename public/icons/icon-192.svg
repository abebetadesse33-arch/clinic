<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="niniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005C4B"/>
      <stop offset="50%" stop-color="#0D8268"/>
      <stop offset="100%" stop-color="#04382D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#niniGrad)"/>
  <!-- Medical Cross / N Logo -->
  <g transform="translate(46, 46)" filter="url(#glow)">
    <circle cx="50" cy="50" r="42" fill="#FAF8F5" fill-opacity="0.1" stroke="#FAF8F5" stroke-width="3"/>
    <!-- Medical Plus Center -->
    <path d="M50 24 V76 M24 50 H76" stroke="#FAF8F5" stroke-width="10" stroke-linecap="round"/>
    <!-- Leaf / Pulse Accent -->
    <circle cx="68" cy="32" r="6" fill="#52B788"/>
  </g>
</svg>
