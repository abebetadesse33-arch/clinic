<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005C4B"/>
      <stop offset="100%" stop-color="#04382D"/>
    </linearGradient>
  </defs>
  <!-- Full Bleed Square for Safe Area Adaptive Masking -->
  <rect width="512" height="512" fill="url(#maskGrad)"/>
  
  <!-- Safe Zone Elements (within 80% circle, i.e., r=204) -->
