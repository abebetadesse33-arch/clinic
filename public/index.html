<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NiniMed Health</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#005C4B">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0A1612;
      color: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 92, 75, 0.2);
      border-top-color: #52B788;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #FAF8F5;
    }
    p {
      font-size: 14px;
      color: #A2B3AD;
      margin: 0;
    }
  </style>
  <script>
    // Auto-redirect to Next.js root if loaded within browser or hybrid webview
    if (window.location.pathname === '/index.html' || window.location.pathname === '/') {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h1>NiniMed Health</h1>
  <p>Connecting to 24/7 Clinical Network...</p>
</body>
</html>
