name: Deploy NiniMed to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_SSH_PRIVATE_KEY: ${{ secrets.PLESK_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          PLESK_DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
        run: |
          set -Eeuo pipefail
          missing=()
          [ -n "$PLESK_HOST" ] || missing+=(PLESK_HOST)
          [ -n "$PLESK_USERNAME" ] || missing+=(PLESK_USERNAME)
          [ -n "$PLESK_SSH_PRIVATE_KEY" ] || missing+=(PLESK_SSH_PRIVATE_KEY-or-SSH_PRIVATE_KEY)
          [ -n "$PLESK_DEPLOY_PATH" ] || missing+=(PLESK_DEPLOY_PATH)
          [ -n "$PLESK_DOMAIN" ] || missing+=(PLESK_DOMAIN)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          PLESK_SSH_PRIVATE_KEY="${PLESK_SSH_PRIVATE_KEY//$'\\n'/$'\n'}"
          PLESK_SSH_PRIVATE_KEY="${PLESK_SSH_PRIVATE_KEY//$'\r'/}"
          [[ "$PLESK_SSH_PORT" =~ ^[0-9]+$ ]] || { printf 'PLESK_SSH_PORT must be numeric.\n'; exit 1; }
          printf '%s\n' "$PLESK_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/plesk-deploy-key"
          chmod 600 "$RUNNER_TEMP/plesk-deploy-key"
          if ! grep -Eq -- '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' "$RUNNER_TEMP/plesk-deploy-key" || ! grep -Eq -- '-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' "$RUNNER_TEMP/plesk-deploy-key"; then
            printf 'PLESK_SSH_PRIVATE_KEY must contain a complete PEM/OpenSSH private-key block (for example, BEGIN OPENSSH PRIVATE KEY). Configure the raw key contents, not a file path, public key, or base64 value.\n'
            exit 1
          fi
          echo "Plesk deployment secrets are configured."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Assemble deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release deploy.tar.gz
          mkdir -p release/.next

          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public

          tar -czf deploy.tar.gz -C release .

      - name: Upload package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PLESK_HOST }}
          port: ${{ secrets.PLESK_SSH_PORT || '22' }}
          username: ${{ secrets.PLESK_USERNAME }}
          key_path: ${{ runner.temp }}/plesk-deploy-key
          timeout: 30s
          command_timeout: 10m
          source: deploy.tar.gz
          target: /tmp/ninimed-deploy-${{ github.sha }}
          strip_components: 0

      - name: Release package on Plesk
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          RELEASE_ID: ${{ github.sha }}
        with:
          host: ${{ secrets.PLESK_HOST }}
          port: ${{ secrets.PLESK_SSH_PORT || '22' }}
          username: ${{ secrets.PLESK_USERNAME }}
          key_path: ${{ runner.temp }}/plesk-deploy-key
          timeout: 30s
          command_timeout: 10m
          envs: DEPLOY_PATH,PLESK_DOMAIN,RELEASE_ID
          script_stop: true
          script: |
            set -Eeuo pipefail
            PACKAGE_DIR="/tmp/ninimed-deploy-${RELEASE_ID}"
            RELEASE_DIR="${DEPLOY_PATH}/releases/${RELEASE_ID}"

            mkdir -p "${DEPLOY_PATH}/releases"
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "${PACKAGE_DIR}/deploy.tar.gz" -C "${RELEASE_DIR}"
            test -f "${RELEASE_DIR}/server.js"
            node --check "${RELEASE_DIR}/server.js"

            ln -sfn "${RELEASE_DIR}" "${DEPLOY_PATH}/current"
            rm -rf "${DEPLOY_PATH}/.next" "${DEPLOY_PATH}/public" "${DEPLOY_PATH}/node_modules"
            ln -sfn "${DEPLOY_PATH}/current/.next" "${DEPLOY_PATH}/.next"
            ln -sfn "${DEPLOY_PATH}/current/public" "${DEPLOY_PATH}/public"
            ln -sfn "${DEPLOY_PATH}/current/node_modules" "${DEPLOY_PATH}/node_modules"

            rm -rf "${PACKAGE_DIR}"
            find "${DEPLOY_PATH}/releases" -mindepth 1 -maxdepth 1 -type d ! -name "${RELEASE_ID}" -exec rm -rf {} +

            if command -v plesk >/dev/null 2>&1; then
              plesk bin nodejs --restart "${PLESK_DOMAIN}"
            elif [ -x /usr/local/psa/bin/nodejs ]; then
              /usr/local/psa/bin/nodejs --restart "${PLESK_DOMAIN}"
            else
              echo "Plesk nodejs CLI was not found; the application was not restarted." >&2
              exit 1
            fi
