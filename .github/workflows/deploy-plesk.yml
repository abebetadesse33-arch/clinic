name: Deploy NiniMed to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          PLESK_DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
        run: |
          set -Eeuo pipefail
          missing=()
          [ -n "$PLESK_HOST" ] || missing+=(PLESK_HOST)
          [ -n "$PLESK_USERNAME" ] || missing+=(PLESK_USERNAME)
          [ -n "$PLESK_PASSWORD" ] || missing+=(PLESK_PASSWORD)
          [ -n "$PLESK_DEPLOY_PATH" ] || missing+=(PLESK_DEPLOY_PATH)
          [ -n "$PLESK_DOMAIN" ] || missing+=(PLESK_DOMAIN)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          [[ "$PLESK_SSH_PORT" =~ ^[0-9]+$ ]] || { printf 'PLESK_SSH_PORT must be numeric.\n'; exit 1; }
          echo "Plesk deployment secrets are configured."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Assemble deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release deploy.tar.gz
          mkdir -p release/.next

          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public

          tar -czf deploy.tar.gz -C release .

      - name: Check Plesk SSH endpoint
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          echo "Checking SSH endpoint ${PLESK_HOST}:${PLESK_SSH_PORT}"
          timeout 15s bash -c "</dev/tcp/${PLESK_HOST}/${PLESK_SSH_PORT}" || {
            echo "Cannot reach ${PLESK_HOST}:${PLESK_SSH_PORT} from the GitHub runner." >&2
            echo "Verify PLESK_HOST, PLESK_SSH_PORT, and the server firewall/allowlist." >&2
            exit 1
          }

      - name: Upload and release package on Plesk
        shell: bash
        env:
          SSHPASS: ${{ secrets.PLESK_PASSWORD }}
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass

          ssh_options=(
            -o ConnectTimeout=30
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=2
            -o StrictHostKeyChecking=yes
            -p "$PLESK_PORT"
          )
          known_hosts="$RUNNER_TEMP/plesk-known-hosts"
          ssh-keyscan -T 15 -p "$PLESK_PORT" "$PLESK_HOST" > "$known_hosts" 2>/dev/null
          test -s "$known_hosts"
          ssh_options+=( -o UserKnownHostsFile="$known_hosts" )

          remote="${PLESK_USERNAME}@${PLESK_HOST}"
          package_dir="/tmp/ninimed-deploy-${RELEASE_ID}"
          remote_script="${package_dir}/plesk-release.sh"

          timeout 5m sshpass -e ssh "${ssh_options[@]}" "$remote" "mkdir -p '$package_dir'"
          timeout 2m sshpass -e ssh "${ssh_options[@]}" "$remote" "cat > '$remote_script'" < scripts/plesk-release.sh
          timeout 10m sshpass -e ssh "${ssh_options[@]}" "$remote" "cat > '$package_dir/deploy.tar.gz'" < deploy.tar.gz
          timeout 10m sshpass -e ssh "${ssh_options[@]}" "$remote" "chmod 700 '$remote_script' && '$remote_script' '$package_dir' '$DEPLOY_PATH' '$PLESK_DOMAIN'"
