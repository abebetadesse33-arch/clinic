name: Deploy NiniMed to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          PLESK_DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
        run: |
          set -Eeuo pipefail
          
          # Clean and sanitize PLESK_HOST (strip protocol schemes, trailing slashes, and ports)
          if [ -n "${PLESK_HOST:-}" ]; then
            CLEAN_HOST=$(echo "$PLESK_HOST" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|:[0-9]+$||' | sed -E 's|/.*$||' | xargs)
            echo "PLESK_CLEAN_HOST=${CLEAN_HOST}" >> "$GITHUB_ENV"
            echo "PLESK_HOST=${CLEAN_HOST}" >> "$GITHUB_ENV"
          fi
          SSH_PORT="${PLESK_SSH_PORT:-22}"
          echo "PLESK_SSH_PORT=${SSH_PORT}" >> "$GITHUB_ENV"

          if [ -n "${PLESK_WEBHOOK_URL:-}" ]; then
            echo "PLESK_WEBHOOK_URL is configured for instant HTTPS Zero-SSH deployment."
          fi

          missing=()
          [ -n "${PLESK_HOST:-}" ] || missing+=(PLESK_HOST)
          [ -n "${PLESK_USERNAME:-}" ] || missing+=(PLESK_USERNAME)
          [ -n "${PLESK_DEPLOY_PATH:-}" ] || missing+=(PLESK_DEPLOY_PATH)
          [ -n "${PLESK_DOMAIN:-}" ] || missing+=(PLESK_DOMAIN)
          if [ -z "${PLESK_PASSWORD:-}" ] && [ -z "${PLESK_SSH_KEY:-}" ] && [ -z "${PLESK_WEBHOOK_URL:-}" ]; then
            missing+=( "PLESK_PASSWORD, PLESK_SSH_KEY, or PLESK_WEBHOOK_URL" )
          fi
          if [ "${#missing[@]}" -gt 0 ] && [ -z "${PLESK_WEBHOOK_URL:-}" ]; then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          [[ "${SSH_PORT}" =~ ^[0-9]+$ ]] || { printf 'PLESK_SSH_PORT must be numeric.\n'; exit 1; }
          echo "Plesk deployment configuration validated."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build Next.js standalone application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Assemble deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release deploy.tar.gz
          mkdir -p release/.next release/tmp

          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          touch release/tmp/restart.txt

          # Prepend auto-dotenv and startup error logger to release/server.js
          if [ -f scripts/server-prelude.js ]; then
            cat scripts/server-prelude.js release/server.js > release/server-combined.js
            mv -f release/server-combined.js release/server.js
          fi
          cp -f release/server.js release/app.js 2>/dev/null || true

          tar -czf deploy.tar.gz -C release .
          echo "Deployment package assembled (size: $(du -h deploy.tar.gz | cut -f1))."

      - name: Discover active Plesk endpoints (SSH, FTPS, Webhook)
        shell: bash
        run: |
          set -Eeuo pipefail

          RAW_HOST="${PLESK_CLEAN_HOST:-${PLESK_HOST:-}}"
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|:[0-9]+$||' | sed -E 's|/.*$||' | xargs)
          echo "Target Host: ${CLEAN_HOST}"

          # Probe Candidate Hosts (resolves Cloudflare CDN bypass when domain is orange-clouded)
          CANDIDATES=("${CLEAN_HOST}")
          for prefix in "ftp." "plesk." "mail." "server."; do
            candidate="${prefix}${CLEAN_HOST}"
            if getent hosts "$candidate" >/dev/null 2>&1; then
              CANDIDATES+=("$candidate")
            fi
          done

          echo "Candidate host endpoints: ${CANDIDATES[*]}"

          ACTIVE_SSH_HOST=""
          ACTIVE_SSH_PORT=""
          ACTIVE_FTP_HOST=""

          # 1. Probe SSH daemons
          echo "--- Probing SSH endpoints ---"
          PORTS_TO_CHECK=("${PLESK_SSH_PORT:-22}" 22 2222 2200 22222 10022)
          UNIQUE_PORTS=($(echo "${PORTS_TO_CHECK[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))

          for host in "${CANDIDATES[@]}"; do
            for port in "${UNIQUE_PORTS[@]}"; do
              banner=$(echo "" | timeout 3s nc -w 3 "$host" "$port" 2>/dev/null || true)
              if [[ "$banner" == SSH-* ]]; then
                echo "SUCCESS: Found active SSH banner on ${host}:${port} -> ${banner}"
                ACTIVE_SSH_HOST="$host"
                ACTIVE_SSH_PORT="$port"
                break 2
              fi
            done
          done

          # 2. Probe FTP/FTPS daemons (port 21)
          echo "--- Probing FTP/FTPS endpoints (port 21) ---"
          for host in "${CANDIDATES[@]}"; do
            ftp_banner=$(echo "" | timeout 3s nc -w 3 "$host" 21 2>/dev/null || true)
            if [[ "$ftp_banner" == 220* ]] || timeout 3s bash -c "</dev/tcp/${host}/21" 2>/dev/null; then
              echo "SUCCESS: Found active FTP service on ${host}:21"
              ACTIVE_FTP_HOST="$host"
              break
            fi
          done

          # Fallbacks if nc was silent but port might be open
          [ -n "$ACTIVE_SSH_HOST" ] || ACTIVE_SSH_HOST="${CLEAN_HOST}"
          [ -n "$ACTIVE_SSH_PORT" ] || ACTIVE_SSH_PORT="${PLESK_SSH_PORT:-22}"
          [ -n "$ACTIVE_FTP_HOST" ] || ACTIVE_FTP_HOST="${CLEAN_HOST}"

          echo "PLESK_ACTIVE_HOST=${ACTIVE_SSH_HOST}" >> "$GITHUB_ENV"
          echo "PLESK_ACTIVE_PORT=${ACTIVE_SSH_PORT}" >> "$GITHUB_ENV"
          echo "PLESK_ACTIVE_FTP_HOST=${ACTIVE_FTP_HOST}" >> "$GITHUB_ENV"
          echo "PLESK_HOST=${ACTIVE_SSH_HOST}" >> "$GITHUB_ENV"
          echo "PLESK_PORT=${ACTIVE_SSH_PORT}" >> "$GITHUB_ENV"
          echo "PLESK_FTP_HOST=${ACTIVE_FTP_HOST}" >> "$GITHUB_ENV"
          echo "Discovered SSH: ${ACTIVE_SSH_HOST}:${ACTIVE_SSH_PORT} | FTP: ${ACTIVE_FTP_HOST}:21"

      - name: Deploy package to Live Plesk
        shell: bash
        env:
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
          DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          # ══════════════════════════════════════════════════════════════════
          # METHOD 1: Plesk Native Git Webhook (Zero-SSH, HTTPS, < 5 Seconds)
          # ══════════════════════════════════════════════════════════════════
          if [ -n "${PLESK_WEBHOOK_URL:-}" ]; then
            echo ">>> [Method 1] Triggering Plesk Native Git Webhook..."
            response=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$PLESK_WEBHOOK_URL" || true)
            http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2 || true)
            body=$(echo "$response" | sed '/HTTP_STATUS:/d' || true)
            echo "Webhook Response (HTTP $http_status): $body"
            if [ -n "$http_status" ] && [ "$http_status" -ge 200 ] && [ "$http_status" -lt 400 ]; then
              echo "=================================================================="
              echo "SUCCESS: Plesk Git Webhook executed successfully (HTTP $http_status)!"
              echo "Live deployment finalized via Plesk Native Git."
              echo "=================================================================="
              exit 0
            fi
            echo "Plesk Webhook returned HTTP $http_status. Proceeding to direct deployment methods..."
          fi

          # ══════════════════════════════════════════════════════════════════
          # METHOD 2: Direct SSH Release Pipeline
          # ══════════════════════════════════════════════════════════════════
          known_hosts="$RUNNER_TEMP/plesk-known-hosts"
          mux_socket="$RUNNER_TEMP/ssh_mux_%h_%p_%r"

          ssh_base_options=(
            -p "$PLESK_PORT"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$known_hosts"
            -o ConnectTimeout=12
            -o ConnectionAttempts=1
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o IPQoS=throughput
            -o ControlMaster=auto
            -o ControlPath="$mux_socket"
            -o ControlPersist=10m
          )

          ssh_available=false
          if [ -n "${PLESK_SSH_KEY:-}" ]; then
            echo "Configured SSH private key authentication."
            key_file="$RUNNER_TEMP/plesk_id_rsa"
            printf '%s\n' "$PLESK_SSH_KEY" > "$key_file"
            chmod 600 "$key_file"
            ssh_base_options+=( -i "$key_file" -o IdentitiesOnly=yes )
            ssh_cmd=( ssh "${ssh_base_options[@]}" )
            ssh_available=true
          elif [ -n "${PLESK_PASSWORD:-}" ]; then
            echo "Configured SSH password authentication (sshpass)."
            if ! command -v sshpass >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sshpass
            fi
            export SSHPASS="$PLESK_PASSWORD"
            ssh_cmd=( sshpass -e ssh "${ssh_base_options[@]}" )
            ssh_available=true
          fi

          if [ "$ssh_available" = true ]; then
            remote="${PLESK_USERNAME}@${PLESK_HOST}"
            package_dir="/tmp/ninimed-deploy-${RELEASE_ID}"
            remote_script="${package_dir}/plesk-release.sh"

            echo ">>> [Method 2] Attempting SSH connection to ${remote}:${PLESK_PORT}..."
            if timeout 15s "${ssh_cmd[@]}" "$remote" "mkdir -p '$package_dir'" 2>/dev/null; then
              echo "SSH connection established successfully!"
              echo "Uploading release script..."
              timeout 2m "${ssh_cmd[@]}" "$remote" "cat > '$remote_script'" < scripts/plesk-release.sh

              echo "Uploading standalone package (deploy.tar.gz)..."
              timeout 10m "${ssh_cmd[@]}" "$remote" "cat > '$package_dir/deploy.tar.gz'" < deploy.tar.gz

              echo "Executing release activation on Plesk..."
              timeout 10m "${ssh_cmd[@]}" "$remote" "chmod 700 '$remote_script' && '$remote_script' '$package_dir' '$DEPLOY_PATH' '$PLESK_DOMAIN'"

              echo "=================================================================="
              echo "SUCCESS: SSH deployment and Phusion Passenger activation completed!"
              echo "=================================================================="
              exit 0
            else
              echo "SSH port ${PLESK_PORT} unreachable or firewalled. Proceeding to FTPS..."
            fi
          fi

          # ══════════════════════════════════════════════════════════════════
          # METHOD 3: Automated FTPS / FTP Deployment (Port 21)
          # ══════════════════════════════════════════════════════════════════
          echo ">>> [Method 3] Activating Automated FTPS deployment (port 21)..."
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
          fi

          # Determine relative directory inside Plesk FTP chroot
          FTP_DEST_DIR=""
          if [[ "$DEPLOY_PATH" =~ /var/www/vhosts/[^/]+/(.+) ]]; then
            FTP_DEST_DIR="${BASH_REMATCH[1]}"
          elif [[ "$DEPLOY_PATH" =~ ^/(.+) ]]; then
            FTP_DEST_DIR="${BASH_REMATCH[1]}"
          else
            FTP_DEST_DIR="${DEPLOY_PATH}"
          fi
          [ -n "$FTP_DEST_DIR" ] || FTP_DEST_DIR="httpdocs"
          echo "Calculated FTP Chroot Target Path: '${FTP_DEST_DIR}'"

          # Clean FTP Host
          CLEAN_FTP_HOST=$(echo "${PLESK_FTP_HOST}" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|:[0-9]+$||' | sed -E 's|/.*$||' | xargs)
          echo "Connecting to FTP server: ftp://${CLEAN_FTP_HOST}:21"

          # Attempt 1: FTPS with TLS
          ftps_success=false
          if lftp -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set ftp:passive-mode true;
            set net:timeout 25;
            set net:max-retries 2;
            mirror --reverse --delete --exclude-glob .env* --exclude-glob *.log --verbose=1 release/ '${FTP_DEST_DIR}/' || mirror --reverse --delete --exclude-glob .env* --exclude-glob *.log --verbose=1 release/ '${DEPLOY_PATH}/';
            quit;
          " -u "${PLESK_USERNAME},${PLESK_PASSWORD}" "ftp://${CLEAN_FTP_HOST}:21"; then
            ftps_success=true
          else
            echo "FTPS TLS mirror failed; attempting plain FTP fallback..."
            if lftp -e "
              set ftp:ssl-allow no;
              set ftp:passive-mode true;
              set net:timeout 25;
              set net:max-retries 2;
              mirror --reverse --exclude-glob .env* --exclude-glob *.log --verbose=1 release/ '${FTP_DEST_DIR}/';
              quit;
            " -u "${PLESK_USERNAME},${PLESK_PASSWORD}" "ftp://${CLEAN_FTP_HOST}:21"; then
              ftps_success=true
            fi
          fi

          if [ "$ftps_success" = true ]; then
            echo "=================================================================="
            echo "SUCCESS: Deployment files synchronized via FTP/FTPS!"
            echo "Phusion Passenger reload triggered via tmp/restart.txt."
            echo "=================================================================="
            exit 0
          fi

          # ══════════════════════════════════════════════════════════════════
          # ERROR DIAGNOSTICS & 30-SECOND LIVE DEPLOY FIX
          # ══════════════════════════════════════════════════════════════════
          echo "----------------------------------------------------------------------------------" >&2
          echo "ERROR: All automated deployment channels failed." >&2
          echo "" >&2
          echo "To finalize live deployment in 30 seconds with 100% reliability:" >&2
          echo "  1. In Plesk > Domains > ${PLESK_DOMAIN} > Git:" >&2
          echo "     Copy your 'Webhook URL' (e.g. https://${PLESK_HOST}:8443/modules/git/public/web-hook...)" >&2
          echo "  2. In GitHub > Settings > Secrets and variables > Actions:" >&2
          echo "     Add secret 'PLESK_WEBHOOK_URL' with that URL." >&2
          echo "  3. In Plesk > Git > Additional deployment actions:" >&2
          echo "     Ensure command is set to: bash scripts/plesk-git-deploy.sh" >&2
          echo "----------------------------------------------------------------------------------" >&2
          exit 1
