name: Deploy NiniMed to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_method:
        description: "Force a specific deployment method: webhook | ssh | ftp | api"
        required: false
        default: ""
      migration_only:
        description: "Run migrations without deploying the application"
        required: false
        type: boolean
        default: false
      seed_enabled:
        description: "Explicitly run production seed data"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────────────
      # STEP 1: Validate & normalize secrets
      # ────────────────────────────────────────────────────────────────────────
      - name: Validate deployment secrets
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT }}
          PLESK_DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
          PLESK_FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
          PLESK_FTP_PORT: ${{ secrets.PLESK_FTP_PORT }}
          PLESK_API_HOST: ${{ secrets.PLESK_API_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          # Sanitize PLESK_HOST: strip protocol, trailing slashes, ports
          RAW_HOST="${PLESK_HOST:-}"
          CLEAN_HOST=""
          if [ -n "$RAW_HOST" ]; then
            CLEAN_HOST=$(printf '%s' "$RAW_HOST" \
              | sed -E 's|^[a-zA-Z]+://||' \
              | sed -E 's|:[0-9]+$||' \
              | sed -E 's|/.*$||' \
              | xargs)
          fi

          SSH_PORT="${PLESK_SSH_PORT:-22}"
          FTP_PORT="${PLESK_FTP_PORT:-21}"

          {
            echo "PLESK_HOST=${CLEAN_HOST}"
            echo "PLESK_CLEAN_HOST=${CLEAN_HOST}"
            echo "PLESK_SSH_PORT=${SSH_PORT}"
            echo "PLESK_FTP_PORT=${FTP_PORT}"
          } >> "$GITHUB_ENV"

          echo "Host          : ${CLEAN_HOST}"
          echo "SSH port hint : ${SSH_PORT}"
          echo "FTP port hint : ${FTP_PORT}"
          echo "Webhook URL   : ${PLESK_WEBHOOK_URL:+(set)}"
          echo "FTP host      : ${PLESK_FTP_HOST:+(set)}"

          # Validate minimum secrets (skip hard check when webhook is the sole method)
          missing=()
          [ -n "$CLEAN_HOST" ]                      || missing+=(PLESK_HOST)
          [ -n "${PLESK_USERNAME:-}" ]               || missing+=(PLESK_USERNAME)
          [ -n "${PLESK_DEPLOY_PATH:-}" ]            || missing+=(PLESK_DEPLOY_PATH)
          [ -n "${PLESK_DOMAIN:-}" ]                 || missing+=(PLESK_DOMAIN)
          if [ -z "${DATABASE_URL:-}" ] && [ -z "${PLESK_WEBHOOK_URL:-}" ]; then
            missing+=(DATABASE_URL)
          fi
          if [ -z "${PLESK_PASSWORD:-}" ] && [ -z "${PLESK_SSH_KEY:-}" ] && [ -z "${PLESK_WEBHOOK_URL:-}" ]; then
            missing+=("PLESK_PASSWORD or PLESK_SSH_KEY or PLESK_WEBHOOK_URL")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '❌ Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [ -n "${DATABASE_URL:-}" ] && [[ "${DATABASE_URL}" =~ @(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?/ ]] && [ -z "${PLESK_WEBHOOK_URL:-}" ]; then
            echo "❌ DATABASE_URL points to localhost. Set it to the PostgreSQL host reachable from Plesk, not the GitHub runner." >&2
            exit 1
          fi
          echo "✅ Deployment secrets validated."

      # ────────────────────────────────────────────────────────────────────────
      # STEP 2: Build
      # ────────────────────────────────────────────────────────────────────────
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run production database migration
        if: env.DEPLOY_WEBHOOK_URL == '' || (!contains(env.DEPLOY_DATABASE_URL, 'localhost') && !contains(env.DEPLOY_DATABASE_URL, '127.0.0.1') && !contains(env.DEPLOY_DATABASE_URL, '::1'))
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NINIMED_STRICT_DB: "true"
        run: bun run db:migrate

      - name: Use remote Plesk migration for webhook deployment
        if: env.DEPLOY_WEBHOOK_URL != '' && (contains(env.DEPLOY_DATABASE_URL, 'localhost') || contains(env.DEPLOY_DATABASE_URL, '127.0.0.1') || contains(env.DEPLOY_DATABASE_URL, '::1'))
        run: echo "DATABASE_URL is local to the runner; Plesk webhook deployment will run migrations on the Plesk host."

      - name: Run explicitly requested production seed
        if: github.event_name == 'workflow_dispatch' && inputs.seed_enabled == true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          ALLOW_PRODUCTION_SEED: "true"
          NINIMED_STRICT_DB: "true"
        run: bun run db:seed

      - name: Build Next.js standalone application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # ────────────────────────────────────────────────────────────────────────
      # STEP 3: Assemble release package
      # ────────────────────────────────────────────────────────────────────────
      - name: Assemble deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release deploy.tar.gz
          mkdir -p release/.next release/tmp

          cp -R .next/standalone/. release/
          cp -R .next/static       release/.next/static
          cp -R public             release/public
          touch release/tmp/restart.txt

          # Keep Next's generated server in its own module context and package
          # the auto-dotenv prelude beside a stable Passenger wrapper.
          if [ -f scripts/server-prelude.js ]; then
            cp -f scripts/server-prelude.js release/plesk-prelude.js
            cat > release/server.js <<'NODE_ENTRYPOINT'
          require('./plesk-prelude.js');
          require('./.next/standalone/server.js');
          NODE_ENTRYPOINT
          fi
          cp -f release/server.js release/app.js 2>/dev/null || true

          tar -czf deploy.tar.gz -C release .
          echo "✅ Package assembled: $(du -h deploy.tar.gz | cut -f1)"

      # ────────────────────────────────────────────────────────────────────────
      # STEP 4: Discover active SSH port across common Plesk ports
      # ────────────────────────────────────────────────────────────────────────
      - name: Discover active Plesk SSH port
        shell: bash
        env:
          PLESK_FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
        run: |
          set -euo pipefail

          CLEAN_HOST="${PLESK_CLEAN_HOST}"
          echo "🔍 Probing SSH on host: ${CLEAN_HOST}"

          # Build candidate hostnames (bypass Cloudflare orange-cloud CDN)
          CANDIDATES=("${CLEAN_HOST}")
          for prefix in "ftp." "mail." "server." "plesk." "direct."; do
            candidate="${prefix}${CLEAN_HOST}"
            if getent hosts "$candidate" > /dev/null 2>&1; then
              CANDIDATES+=("$candidate")
              echo "  Found DNS candidate: $candidate"
            fi
          done

          # Common SSH ports used by Plesk hosting providers
          SSH_PORTS=("${PLESK_SSH_PORT}" 22 2222 2200 8022 22000 10022 2022)

          ACTIVE_HOST=""
          ACTIVE_PORT=""

          for host in "${CANDIDATES[@]}"; do
            for port in "${SSH_PORTS[@]}"; do
              banner=$(echo "" | timeout 4s nc -w 4 "$host" "$port" 2>/dev/null || true)
              if [[ "$banner" == SSH-* ]]; then
                echo "✅ SSH banner found on ${host}:${port} → ${banner}"
                ACTIVE_HOST="$host"
                ACTIVE_PORT="$port"
                break 2
              fi
            done
          done

          if [ -z "$ACTIVE_HOST" ]; then
            echo "⚠️  No SSH banner found on any port. SSH deployment will be skipped."
            ACTIVE_HOST="${CLEAN_HOST}"
            ACTIVE_PORT="${PLESK_SSH_PORT:-22}"
          fi

          ACTIVE_FTP_HOST="${PLESK_FTP_HOST:-}"

          {
            echo "PLESK_ACTIVE_HOST=${ACTIVE_HOST}"
            echo "PLESK_ACTIVE_PORT=${ACTIVE_PORT}"
            echo "PLESK_ACTIVE_FTP_HOST=${ACTIVE_FTP_HOST}"
          } >> "$GITHUB_ENV"
          echo "Discovery result → SSH: ${ACTIVE_HOST}:${ACTIVE_PORT} | FTP: ${ACTIVE_FTP_HOST:-disabled}"

      # ────────────────────────────────────────────────────────────────────────
      # STEP 5: Deploy (4 methods, first success wins)
      # ────────────────────────────────────────────────────────────────────────
      - name: Deploy to Live Plesk
        if: inputs.migration_only != true
        shell: bash
        env:
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
          PLESK_FTP_HOST: ${{ secrets.PLESK_FTP_HOST }}
          PLESK_FTP_PORT: ${{ secrets.PLESK_FTP_PORT }}
          PLESK_API_HOST: ${{ secrets.PLESK_API_HOST }}
          DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          RELEASE_ID: ${{ github.sha }}
          FORCE_METHOD: ${{ github.event.inputs.force_method }}
        run: |
          set -euo pipefail
          DEPLOYED=false

          # ════════════════════════════════════════════════════════════════════
          # METHOD 1 — Plesk Native Git Webhook (Zero-SSH, HTTPS, ~5 seconds)
          # Set secret: PLESK_WEBHOOK_URL = https://your-host:8443/modules/git/public/web-hook.php?uuid=...
          # ════════════════════════════════════════════════════════════════════
          if [ "${FORCE_METHOD:-}" != "ssh" ] && [ "${FORCE_METHOD:-}" != "ftp" ] && [ "${FORCE_METHOD:-}" != "api" ]; then
            if [ -n "${PLESK_WEBHOOK_URL:-}" ]; then
              echo ">>> [Method 1] Triggering Plesk Native Git Webhook..."

              # Try the URL as-is, then with GET as fallback (some Plesk versions differ)
              for method in POST GET; do
                response=$(curl -k -sS -o /tmp/webhook_body -w "%{http_code}" \
                  -X "$method" \
                  -H "Content-Type: application/json" \
                  --connect-timeout 20 --max-time 60 \
                  "$PLESK_WEBHOOK_URL" 2>/tmp/webhook_error || true)
                body=$(cat /tmp/webhook_body 2>/dev/null || true)
                transport_error=$(cat /tmp/webhook_error 2>/dev/null || true)
                if [ -z "$response" ]; then response="000"; fi
                echo "  Webhook $method → HTTP ${response}: ${body}${transport_error:+ | ${transport_error}}"

                if [ "$response" -ge 200 ] && [ "$response" -lt 400 ] 2>/dev/null; then
                  echo "======================================================"
                  echo "✅ SUCCESS [Method 1]: Plesk Git Webhook (HTTP $response)"
                  echo "======================================================"
                  DEPLOYED=true
                  break
                fi
              done

              if [ "$DEPLOYED" = "true" ]; then
                exit 0
              fi

              echo "⚠️  Webhook returned HTTP ${response}. See fix instructions at bottom of log."
              echo "    Common causes:"
              echo "    • URL is wrong — copy it from Plesk > Domains > Git > Webhook URL"
              echo "    • Plesk Git Extension is not installed (check Extensions tab)"
              echo "    • Repository has not been added to Plesk Git yet"
            fi
          fi

          # ════════════════════════════════════════════════════════════════════
          # METHOD 2 — Direct SSH Release Pipeline (port-agnostic, key or password)
          # ════════════════════════════════════════════════════════════════════
          if [ "${FORCE_METHOD:-}" != "ftp" ] && [ "${FORCE_METHOD:-}" != "api" ] && [ "${FORCE_METHOD:-}" != "webhook" ]; then
            SSH_HOST="${PLESK_ACTIVE_HOST}"
            SSH_PORT="${PLESK_ACTIVE_PORT}"
            known_hosts="$RUNNER_TEMP/plesk-known-hosts"
            mux_socket="$RUNNER_TEMP/ssh_mux_%h_%p_%r"

            ssh_opts=(
              -p "$SSH_PORT"
              -o StrictHostKeyChecking=accept-new
              -o UserKnownHostsFile="$known_hosts"
              -o ConnectTimeout=15
              -o ConnectionAttempts=1
              -o ServerAliveInterval=15
              -o ServerAliveCountMax=3
              -o ControlMaster=auto
              -o "ControlPath=$mux_socket"
              -o ControlPersist=10m
            )

            ssh_available=false
            if [ -n "${PLESK_SSH_KEY:-}" ]; then
              echo "🔑 Using SSH private key authentication."
              key_file="$RUNNER_TEMP/plesk_deploy_key"
              printf '%s\n' "$PLESK_SSH_KEY" > "$key_file"
              chmod 600 "$key_file"
              ssh_opts+=(-i "$key_file" -o IdentitiesOnly=yes)
              ssh_cmd=(ssh "${ssh_opts[@]}")
              ssh_available=true
            elif [ -n "${PLESK_PASSWORD:-}" ]; then
              echo "🔑 Using SSH password authentication (sshpass)."
              if ! command -v sshpass > /dev/null 2>&1; then
                sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends sshpass
              fi
              export SSHPASS="$PLESK_PASSWORD"
              ssh_cmd=(sshpass -e ssh "${ssh_opts[@]}")
              ssh_available=true
            fi

            if [ "$ssh_available" = "true" ]; then
              remote="${PLESK_USERNAME}@${SSH_HOST}"
              pkg_dir="/tmp/ninimed-${RELEASE_ID:0:12}"
              echo ">>> [Method 2] Connecting to SSH ${remote}:${SSH_PORT}..."

              if timeout 18s "${ssh_cmd[@]}" "$remote" "mkdir -p '${pkg_dir}'" 2>/dev/null; then
                echo "✅ SSH connected."
                echo "  Uploading release script..."
                timeout 120s "${ssh_cmd[@]}" "$remote" "cat > '${pkg_dir}/plesk-release.sh'" \
                  < scripts/plesk-release.sh

                echo "  Uploading package ($(du -h deploy.tar.gz | cut -f1))..."
                timeout 600s "${ssh_cmd[@]}" "$remote" "cat > '${pkg_dir}/deploy.tar.gz'" \
                  < deploy.tar.gz

                echo "  Activating release on Plesk server..."
                timeout 300s "${ssh_cmd[@]}" "$remote" \
                  "chmod 700 '${pkg_dir}/plesk-release.sh' && \
                   '${pkg_dir}/plesk-release.sh' '${pkg_dir}' '${DEPLOY_PATH}' '${PLESK_DOMAIN}'"

                echo "======================================================"
                echo "✅ SUCCESS [Method 2]: SSH deployment complete!"
                echo "======================================================"
                DEPLOYED=true
              else
                echo "⚠️  SSH port ${SSH_PORT} on ${SSH_HOST} is unreachable or firewalled."
                echo "    Tip: Set PLESK_SSH_PORT secret to the actual SSH port (e.g. 8022, 2222)."
              fi
            fi
          fi

          if [ "$DEPLOYED" = "true" ]; then exit 0; fi

          # ════════════════════════════════════════════════════════════════════
          # METHOD 3 — Plesk REST API (port 8443) — trigger git pull + deploy
          # Requires: PLESK_HOST, PLESK_USERNAME, PLESK_PASSWORD, PLESK_DOMAIN
          # ════════════════════════════════════════════════════════════════════
          if [ "${FORCE_METHOD:-}" != "ftp" ] && [ "${FORCE_METHOD:-}" != "webhook" ] && [ "${FORCE_METHOD:-}" != "ssh" ]; then
            if [ -n "${PLESK_PASSWORD:-}" ] && [ -n "${PLESK_HOST:-}" ]; then
              echo ">>> [Method 3] Attempting Plesk REST API deployment (port 8443)..."
              API_HOST="${PLESK_API_HOST:-${PLESK_ACTIVE_HOST}}"
              API_BASE="https://${API_HOST}:8443/api/v2"
              echo "  Plesk API host: ${API_HOST}:8443"

              # Find git site ID via REST API
              sites_http=$(curl -k -sS -o /tmp/plesk_sites_response -w "%{http_code}" --connect-timeout 15 --max-time 30 \
                -u "${PLESK_USERNAME}:${PLESK_PASSWORD}" \
                "${API_BASE}/sites" 2>/tmp/plesk_api_error || true)
              sites_response=$(cat /tmp/plesk_sites_response 2>/dev/null || true)
              api_transport_error=$(cat /tmp/plesk_api_error 2>/dev/null || true)
              if [ -z "$sites_http" ]; then sites_http="000"; fi
              echo "  Plesk sites API → HTTP ${sites_http}${api_transport_error:+ | ${api_transport_error}}"
              if [ "$sites_http" = "401" ] || [ "$sites_http" = "403" ]; then
                echo "  Plesk API authentication failed. Check PLESK_USERNAME/PLESK_PASSWORD."
              elif [ "$sites_http" = "404" ]; then
                echo "  Plesk API endpoint was not found. Set PLESK_API_HOST to the server hostname/IP, not the public website hostname."
              fi

              site_id=$(echo "$sites_response" | python3 -c "import sys,json; data=json.load(sys.stdin); domain='${PLESK_DOMAIN}'; items=data if isinstance(data,list) else data.get('items',[]) if isinstance(data,dict) else []; print(next((str(site.get('id','')) for site in items if domain in str(site.get('name','')) or domain in str(site.get('webspace_name',''))), ''))" 2>/dev/null || true)

              if [ -n "$site_id" ]; then
                echo "  Found Plesk site ID: $site_id"
                deploy_resp=$(curl -k -s -o /tmp/api_deploy -w "%{http_code}" \
                  --connect-timeout 15 --max-time 120 \
                  -u "${PLESK_USERNAME}:${PLESK_PASSWORD}" \
                  -X POST "${API_BASE}/sites/${site_id}/git/deploy" \
                  -H "Content-Type: application/json" \
                  -d '{}' 2>/dev/null || echo "000")
                api_body=$(cat /tmp/api_deploy 2>/dev/null || true)
                echo "  REST API deploy → HTTP ${deploy_resp}: ${api_body}"
                if [ "$deploy_resp" -ge 200 ] && [ "$deploy_resp" -lt 400 ] 2>/dev/null; then
                  echo "======================================================"
                  echo "✅ SUCCESS [Method 3]: Plesk REST API deployment triggered!"
                  echo "======================================================"
                  DEPLOYED=true
                fi
              else
                echo "  Could not find site ID via REST API. Skipping."
              fi
            fi
          fi

          if [ "$DEPLOYED" = "true" ]; then exit 0; fi

          # ════════════════════════════════════════════════════════════════════
          # METHOD 4 — FTPS / FTP (lftp mirror)
          # Requires: PLESK_FTP_HOST secret
          # ════════════════════════════════════════════════════════════════════
          FTP_HOST="${PLESK_ACTIVE_FTP_HOST:-${PLESK_FTP_HOST:-}}"
          FTP_PORT="${PLESK_FTP_PORT:-21}"

          if [ -n "$FTP_HOST" ] && [ -n "${PLESK_PASSWORD:-}" ]; then
            echo ">>> [Method 4] FTPS deployment to ${FTP_HOST}:${FTP_PORT}..."
            if ! command -v lftp > /dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp
            fi

            CLEAN_FTP_HOST=$(printf '%s' "$FTP_HOST" \
              | sed -E 's|^[a-zA-Z]+://||' \
              | sed -E 's|:[0-9]+$||' \
              | sed -E 's|/.*$||' \
              | xargs)

            # Determine chroot-relative destination inside Plesk FTP jail
            if [[ "${DEPLOY_PATH}" =~ /var/www/vhosts/[^/]+/(.+) ]]; then
              FTP_DEST="${BASH_REMATCH[1]}"
            else
              FTP_DEST="${DEPLOY_PATH#/}"
            fi
            [ -n "$FTP_DEST" ] || FTP_DEST="httpdocs"
            echo "  FTP chroot target: /${FTP_DEST}"

            ftp_ok=false
            # Try FTPS (TLS) first, then plain FTP
            for ssl in "yes" "no"; do
              if lftp -e "
                set ftp:ssl-allow $ssl;
                set ftp:ssl-protect-data $ssl;
                set ssl:verify-certificate no;
                set ssl:check-hostname no;
                set ftp:passive-mode true;
                set net:timeout 30;
                set net:max-retries 2;
                mirror --reverse --delete \
                  --exclude-glob '.env*' --exclude-glob '*.log' \
                  --verbose=1 release/ '${FTP_DEST}/';
                quit;
              " -u "${PLESK_USERNAME},${PLESK_PASSWORD}" \
                "ftp://${CLEAN_FTP_HOST}:${FTP_PORT}"; then
                ftp_ok=true
                break
              fi
              echo "  FTP ssl=${ssl} failed, retrying..."
            done

            if [ "$ftp_ok" = "true" ]; then
              echo "======================================================"
              echo "✅ SUCCESS [Method 4]: FTP/FTPS deployment complete!"
              echo "======================================================"
              DEPLOYED=true
            fi
          fi

          if [ "$DEPLOYED" = "true" ]; then exit 0; fi

          # ════════════════════════════════════════════════════════════════════
          # ALL METHODS FAILED — Print actionable fix guide
          # ════════════════════════════════════════════════════════════════════
          cat >&2 <<'EOF'
          ──────────────────────────────────────────────────────────────────────
          ❌ All deployment methods failed. Use ONE of the fixes below:

          ══ FIX A (Easiest — 2 minutes, no SSH needed) ════════════════════════
          1. In Plesk → Websites & Domains → Git
          2. Click "Add Repository":
             • Repository URL: https://github.com/abebetadesse33-arch/clinic.git
             • Deployment mode: Automatic
             • Additional deployment actions:
               bash scripts/plesk-git-deploy.sh
          3. Copy the "Webhook URL" shown (looks like:
             https://YOUR-HOST:8443/modules/git/public/web-hook.php?uuid=XXXXX)
          4. In GitHub → Settings → Secrets → Actions → New secret:
             Name:  PLESK_WEBHOOK_URL
             Value: <paste the URL from step 3>
          5. Re-run this workflow. Done — deploys in <10 seconds every push.

          ══ FIX B (SSH — if your host supports it) ════════════════════════════
          1. Log in to Plesk → Domains → Web Hosting Access
             → Set "Access to server over SSH" to /bin/bash
          2. Find your SSH port in the welcome email from your host, or try:
             2222, 8022, 22000 (set secret PLESK_SSH_PORT to the correct port)
          3. Generate a deploy key (no passphrase):
             ssh-keygen -t ed25519 -C "github-deploy" -f deploy_key -N ""
          4. Add deploy_key.pub to Plesk SSH user's ~/.ssh/authorized_keys
          5. Add deploy_key (private) to GitHub secret: PLESK_SSH_KEY
          6. Re-run this workflow.

          ══ FIX C (FTP) ════════════════════════════════════════════════════════
          1. In Plesk → FTP Access, create an FTP user if needed.
          2. Add GitHub secret: PLESK_FTP_HOST = ftp.your-domain.com
          3. PLESK_PASSWORD should match the FTP user password.
          4. Re-run this workflow.
          ──────────────────────────────────────────────────────────────────────
          EOF
          exit 1

      - name: Verify production health
        if: inputs.migration_only != true
        env:
          HEALTHCHECK_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}/api/health
          HEALTHCHECK_INSECURE_TLS: "true"
        run: |
          set -Eeuo pipefail

          # Give Plesk time to pull the code, install deps, and restart Node.
          # Without this, early attempts hit a still-booting or still-deploying server.
          echo "Waiting 30 s for server to start…"
          sleep 30

          # 15 attempts × 15 s = up to 3.75 minutes total after the initial wait.
          for attempt in $(seq 1 15); do
            if bun run healthcheck; then
              echo "✅ Health check passed on attempt ${attempt}/15."
              exit 0
            fi
            echo "Health check attempt ${attempt}/15 failed; retrying in 15 seconds."
            sleep 15
          done

          echo "" >&2
          echo "❌ Production health check failed after deployment." >&2
          echo "" >&2
          echo "Common causes of HTTP 500 on first boot:" >&2
          echo "  • Missing runtime env vars on Plesk (DATABASE_URL, NEXTAUTH_SECRET, NEXTAUTH_URL)." >&2
          echo "    → Check Plesk → Websites & Domains → <domain> → Node.js → Environment Variables." >&2
          echo "  • The app cannot reach its database from the Plesk host." >&2
          echo "  • plesk-release.sh did not run 'bun run db:migrate' after deployment." >&2
          echo "  → Check the Node.js application log in Plesk for the actual startup error." >&2
          exit 1
