name: Deploy NiniMed to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
          PLESK_DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
        run: |
          set -Eeuo pipefail
          missing=()
          [ -n "$PLESK_HOST" ] || missing+=(PLESK_HOST)
          [ -n "$PLESK_USERNAME" ] || missing+=(PLESK_USERNAME)
          [ -n "$PLESK_DEPLOY_PATH" ] || missing+=(PLESK_DEPLOY_PATH)
          [ -n "$PLESK_DOMAIN" ] || missing+=(PLESK_DOMAIN)
          if [ -z "$PLESK_PASSWORD" ] && [ -z "$PLESK_SSH_KEY" ]; then
            missing+=( "PLESK_PASSWORD or PLESK_SSH_KEY" )
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing GitHub Actions secret(s): %s\n' "${missing[*]}"
            exit 1
          fi
          [[ "$PLESK_SSH_PORT" =~ ^[0-9]+$ ]] || { printf 'PLESK_SSH_PORT must be numeric.\n'; exit 1; }
          echo "Plesk deployment secrets are configured."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Next.js standalone application
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Assemble deployment package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf release deploy.tar.gz
          mkdir -p release/.next

          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public

          tar -czf deploy.tar.gz -C release .

      - name: Check Plesk SSH endpoint
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_SSH_PORT: ${{ secrets.PLESK_SSH_PORT || '22' }}
        run: |
          set -Eeuo pipefail
          echo "Resolving ${PLESK_HOST}..."
          resolved_ip=$(getent hosts "$PLESK_HOST" | awk '{ print $1 }' | head -n1 || echo "$PLESK_HOST")
          echo "Host ${PLESK_HOST} resolved to IP: ${resolved_ip}"

          ACTIVE_PORT="$PLESK_SSH_PORT"
          echo "Probing SSH identification banner on port ${PLESK_SSH_PORT}..."
          banner=$(echo "" | timeout 4s nc -w 4 "$PLESK_HOST" "$PLESK_SSH_PORT" 2>/dev/null || true)
          if [[ "$banner" == SSH-* ]]; then
            echo "SSH Banner received on port ${PLESK_SSH_PORT}: $banner"
          else
            echo "Port ${PLESK_SSH_PORT} did not return an SSH banner."
            echo "Scanning common Plesk SSH alternative ports (2222, 2200, 22222)..."
            for p in 2222 2200 22222; do
              b=$(echo "" | timeout 2s nc -w 2 "$PLESK_HOST" "$p" 2>/dev/null || true)
              if [[ "$b" == SSH-* ]]; then
                echo "DISCOVERED active SSH daemon on port $p: $b"
                ACTIVE_PORT="$p"
                break
              fi
            done
          fi
          echo "PLESK_ACTIVE_PORT=${ACTIVE_PORT}" >> "$GITHUB_ENV"

      - name: Upload and release package on Plesk
        shell: bash
        env:
          PLESK_HOST: ${{ secrets.PLESK_HOST }}
          PLESK_PORT: ${{ env.PLESK_ACTIVE_PORT || secrets.PLESK_SSH_PORT || '22' }}
          PLESK_USERNAME: ${{ secrets.PLESK_USERNAME }}
          PLESK_PASSWORD: ${{ secrets.PLESK_PASSWORD }}
          PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
          DEPLOY_PATH: ${{ secrets.PLESK_DEPLOY_PATH }}
          PLESK_DOMAIN: ${{ secrets.PLESK_DOMAIN }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          known_hosts="$RUNNER_TEMP/plesk-known-hosts"
          mux_socket="$RUNNER_TEMP/ssh_mux_%h_%p_%r"

          ssh_base_options=(
            -p "$PLESK_PORT"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$known_hosts"
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o IPQoS=throughput
            -o ControlMaster=auto
            -o ControlPath="$mux_socket"
            -o ControlPersist=10m
          )

          # Configure authentication (SSH key takes precedence over password)
          if [ -n "${PLESK_SSH_KEY:-}" ]; then
            echo "Configured SSH private key authentication."
            key_file="$RUNNER_TEMP/plesk_id_rsa"
            printf '%s\n' "$PLESK_SSH_KEY" > "$key_file"
            chmod 600 "$key_file"
            ssh_base_options+=( -i "$key_file" -o IdentitiesOnly=yes )
            ssh_cmd=( ssh "${ssh_base_options[@]}" )
          else
            echo "Configured SSH password authentication (sshpass)."
            if ! command -v sshpass >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends sshpass
            fi
            export SSHPASS="$PLESK_PASSWORD"
            ssh_cmd=( sshpass -e ssh "${ssh_base_options[@]}" )
          fi

          remote="${PLESK_USERNAME}@${PLESK_HOST}"
          package_dir="/tmp/ninimed-deploy-${RELEASE_ID}"
          remote_script="${package_dir}/plesk-release.sh"

          echo "Attempting SSH connection to ${remote}:${PLESK_PORT}..."
          ssh_success=true
          if ! timeout 20s "${ssh_cmd[@]}" "$remote" "mkdir -p '$package_dir'" 2>/dev/null; then
            ssh_success=false
          fi

          if [ "$ssh_success" = true ]; then
            echo "SSH connection established successfully!"
            echo "Uploading release script..."
            timeout 2m "${ssh_cmd[@]}" "$remote" "cat > '$remote_script'" < scripts/plesk-release.sh

            echo "Uploading application package (deploy.tar.gz)..."
            timeout 10m "${ssh_cmd[@]}" "$remote" "cat > '$package_dir/deploy.tar.gz'" < deploy.tar.gz

            echo "Executing release activation..."
            timeout 10m "${ssh_cmd[@]}" "$remote" "chmod 700 '$remote_script' && '$remote_script' '$package_dir' '$DEPLOY_PATH' '$PLESK_DOMAIN'"

            echo "SSH deployment completed successfully."
            exit 0
          fi

          echo "----------------------------------------------------------------------------------"
          echo "NOTICE: SSH connection or banner exchange timed out on port ${PLESK_PORT}."
          echo "Activating automated deployment fallbacks..."
          echo "----------------------------------------------------------------------------------"

          # Fallback 1: Plesk Native Git Webhook (HTTPS, Zero-SSH)
          if [ -n "${PLESK_WEBHOOK_URL:-}" ]; then
            echo ">>> Activating Fallback 1: Plesk Native Git Webhook over HTTPS..."
            response=$(curl -k -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$PLESK_WEBHOOK_URL")
            http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2 || true)
            body=$(echo "$response" | sed '/HTTP_STATUS:/d' || true)
            echo "Webhook Response: $body"
            if [ -n "$http_status" ] && [ "$http_status" -ge 200 ] && [ "$http_status" -lt 400 ]; then
              echo "=================================================================="
              echo "Plesk Webhook triggered successfully (HTTP $http_status)!"
              echo "Live deployment finalized via Plesk Native Git."
              echo "=================================================================="
              exit 0
            fi
            echo "Plesk Webhook returned HTTP $http_status. Trying FTPS fallback..."
          fi

          # Fallback 2: Automated FTPS Sync (Port 21)
          echo ">>> Activating Fallback 2: Automated FTPS deployment (port 21)..."
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends lftp
          fi

          mkdir -p release/tmp
          touch release/tmp/restart.txt

          echo "Synchronizing standalone build to Plesk via FTPS..."
          if lftp -u "$PLESK_USERNAME,$PLESK_PASSWORD" "$PLESK_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; mirror -R release/ '${DEPLOY_PATH}/'; quit"; then
            echo "=================================================================="
            echo "Deployment succeeded via FTPS! Application restarted via tmp/restart.txt."
            echo "=================================================================="
            exit 0
          fi

          echo "----------------------------------------------------------------------------------" >&2
          echo "ERROR: All deployment methods failed." >&2
          echo "To finalize live deployment in 30 seconds:" >&2
          echo "  1. In Plesk > Domains > Git, copy your 'Webhook URL'." >&2
          echo "  2. In GitHub > Settings > Secrets, add 'PLESK_WEBHOOK_URL'." >&2
          echo "----------------------------------------------------------------------------------" >&2
          exit 1
