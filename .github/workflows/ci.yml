name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clinic_enterprise
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/clinic_enterprise
      NODE_ENV: test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NINIMED_STRICT_DB: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Validate database migration
        run: |
          set -Eeuo pipefail
          echo "Running migration against MySQL 127.0.0.1:3306/clinic_enterprise"
          bun run db:migrate

      - name: Validate idempotent seed
        run: bun run db:seed

      - name: Build Next.js application
        run: bun run build

      - name: Validate Docker build
        run: docker build --tag ninimed-ci:${{ github.sha }} .
